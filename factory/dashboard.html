<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kika Factory</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #77776f; --line: #e3e2dc;
    --pass: #2f8f5b; --pass-bg: #e3f3ea; --changes: #b7791f; --changes-bg: #fbf0dc;
    --human: #c2410c; --human-bg: #fdebe2; --merged: #5b5bd6; --accent: #1d1d1b;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9a998f; --line: #2e2d2a;
      --pass: #5cc48a; --pass-bg: #1d3327; --changes: #e0a84a; --changes-bg: #3a2e18;
      --human: #f08a5d; --human-bg: #3d2318; --merged: #9b9bf5; --accent: #ecebe6;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 20px 24px 8px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12px; }
  .legend { margin-left: auto; display: flex; gap: 10px; color: var(--muted); font-size: 12px; align-items: center; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(200px, 1fr)); gap: 12px;
    padding: 12px 24px 32px; overflow-x: auto; }
  .col h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 0 0 8px; display: flex; justify-content: space-between; }
  .col.human h2 { color: var(--human); }
  .lane { display: flex; flex-direction: column; gap: 8px; min-height: 120px;
    border-radius: 10px; padding: 6px; background: color-mix(in srgb, var(--line) 35%, transparent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    box-shadow: var(--shadow); cursor: pointer; transition: transform .12s, border-color .12s; }
  .card:hover { transform: translateY(-1px); border-color: var(--muted); }
  .card.human { border-color: var(--human); background: var(--human-bg); }
  .card.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 3px var(--merged); } to { box-shadow: var(--shadow); } }
  .id { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .title { font-weight: 600; margin: 2px 0 6px; }
  .meta { display: flex; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .meta a { color: inherit; }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--human); }
  .rounds { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .n { font: 10px ui-monospace, Menlo, monospace; color: var(--muted); width: 18px; }
  .chip { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 999px;
    border: 1px dashed var(--line); color: var(--muted); }
  .chip.PASS { border: 1px solid transparent; background: var(--pass-bg); color: var(--pass); }
  .chip.CHANGES { border: 1px solid transparent; background: var(--changes-bg); color: var(--changes); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 20px 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .15s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  aside { position: fixed; top: 0; right: 0; height: 100%; width: min(720px, 100%); background: var(--panel);
    border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .2s;
    display: flex; flex-direction: column; }
  aside.open { transform: none; }
  aside header { border-bottom: 1px solid var(--line); padding: 16px 20px; }
  .close { margin-left: auto; background: none; border: 0; font-size: 20px; color: var(--muted); cursor: pointer; }
  .tabs { display: flex; gap: 4px; padding: 10px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab { font: 12px ui-monospace, Menlo, monospace; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: none; color: var(--ink); cursor: pointer; }
  .tab.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .doc { padding: 16px 24px 40px; overflow: auto; flex: 1; }
  .doc h1, .doc h2, .doc h3 { margin: 1.2em 0 .4em; line-height: 1.25; }
  .doc h1 { font-size: 20px; } .doc h2 { font-size: 16px; } .doc h3 { font-size: 14px; }
  .doc pre { background: var(--bg); border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; overflow: auto; }
  .doc code { font: 12.5px ui-monospace, Menlo, monospace; }
  .doc :not(pre) > code { background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .doc table { border-collapse: collapse; } .doc td, .doc th { border: 1px solid var(--line); padding: 4px 8px; }
  .verdict { display: inline-block; font-weight: 700; padding: 4px 10px; border-radius: 6px; margin-top: 4px; }
  .verdict.ok { background: var(--pass-bg); color: var(--pass); }
  .verdict.no { background: var(--changes-bg); color: var(--changes); }
  .verdict.esc { background: var(--human-bg); color: var(--human); }
  @media (max-width: 700px) { header, .board { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Kika Factory</h1>
  <span class="sub" id="status">loading board.json…</span>
  <div class="legend">
    <span><span class="dot" style="background:var(--pass)"></span> pass</span>
    <span><span class="dot" style="background:var(--changes)"></span> changes</span>
    <span><span class="dot" style="border:1px dashed var(--muted)"></span> pending</span>
    <span><span class="dot" style="background:var(--human)"></span> needs human</span>
  </div>
</header>
<main class="board" id="board"></main>
<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <header><div><div class="id" id="d-id"></div><h1 id="d-title"></h1></div>
    <button class="close" id="close" aria-label="Close">×</button></header>
  <nav class="tabs" id="tabs"></nav>
  <article class="doc" id="doc"></article>
</aside>
<script>
const STAGES = [
  ["spec", "Spec"], ["build", "Build"], ["review", "Review"],
  ["approval", "Approval"], ["needs-human", "Needs human"], ["merged", "Merged"],
];
const REVIEWERS = [["security", "SEC"], ["ux", "UX"], ["ui", "UI"], ["code", "CODE"]];
let board = { jobs: [] }, lastStages = {}, openJob = null, openFile = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function poll() {
  try {
    const res = await fetch("board.json", { cache: "no-store" });
    board = await res.json();
    render();
    document.getElementById("status").textContent =
      `${board.jobs.length} job${board.jobs.length === 1 ? "" : "s"} · updated ${new Date().toLocaleTimeString()}`;
    if (openJob) refreshTabs();
  } catch (e) {
    document.getElementById("status").textContent = "can't read board.json (serve this folder with python3 -m http.server)";
  }
}

function prLink(job) {
  if (!job.pr) return "";
  const url = board.repo ? `https://github.com/${board.repo}/pull/${job.pr}` : "#";
  return `<a href="${url}" target="_blank" onclick="event.stopPropagation()">PR #${job.pr}</a>`;
}

function card(job) {
  const human = job.stage === "needs-human";
  const flash = lastStages[job.id] && lastStages[job.id] !== job.stage ? " flash" : "";
  const rounds = (job.rounds || []).map((r, i) => `
    <div class="round"><span class="n">R${i + 1}</span>${REVIEWERS.map(([k, label]) =>
      `<span class="chip ${esc(r[k] || "pending")}" title="${k}: ${esc(r[k] || "pending")}">${label}</span>`).join("")}</div>`).join("");
  return `<div class="card${human ? " human" : ""}${flash}" data-id="${esc(job.id)}">
    <div class="id">${esc(job.id)}</div>
    ${human ? `<div class="badge">⚑ needs human</div>` : ""}
    <div class="title">${esc(job.title || job.id)}</div>
    <div class="meta">${job.issue ? `<span>#${esc(job.issue)}</span>` : ""}${prLink(job)}
      ${job.decision ? `<span>${esc(job.decision)}</span>` : ""}</div>
    ${rounds ? `<div class="rounds">${rounds}</div>` : ""}
  </div>`;
}

function render() {
  const el = document.getElementById("board");
  el.innerHTML = STAGES.map(([key, label]) => {
    const jobs = board.jobs.filter(j => j.stage === key);
    return `<section class="col${key === "needs-human" ? " human" : ""}">
      <h2><span>${label}</span><span>${jobs.length || ""}</span></h2>
      <div class="lane">${jobs.map(card).join("") || `<div class="empty">—</div>`}</div></section>`;
  }).join("");
  board.jobs.forEach(j => lastStages[j.id] = j.stage);
  el.querySelectorAll(".card").forEach(c => c.onclick = () => open(c.dataset.id));
}

function open(id) {
  openJob = id; openFile = null;
  const job = board.jobs.find(j => j.id === id);
  document.getElementById("d-id").textContent = `${job.id} · ${job.branch || ""}`;
  document.getElementById("d-title").textContent = job.title || job.id;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("scrim").classList.add("open");
  refreshTabs();
}

function refreshTabs() {
  const job = board.jobs.find(j => j.id === openJob);
  if (!job) return;
  const files = job.files || [];
  if (!openFile && files.length) openFile = files[files.length - 1];
  document.getElementById("tabs").innerHTML = files.map(f =>
    `<button class="tab${f === openFile ? " on" : ""}" data-f="${esc(f)}">${esc(f)}</button>`).join("")
    || `<span class="sub">no files yet</span>`;
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => { openFile = t.dataset.f; refreshTabs(); });
  if (openFile) loadFile(job.id, openFile);
}

let shown = "";
async function loadFile(id, file) {
  try {
    const text = await (await fetch(`jobs/${id}/${file}`, { cache: "no-store" })).text();
    const key = id + file + text.length;
    if (key === shown) return;
    shown = key;
    document.getElementById("doc").innerHTML = markdown(text);
  } catch { document.getElementById("doc").textContent = "could not load " + file; }
}

function close() {
  openJob = null; shown = "";
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
}
document.getElementById("close").onclick = close;
document.getElementById("scrim").onclick = close;
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

// Small markdown renderer: headings, fences, lists, tables, bold, inline code, links.
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
}
function markdown(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  let out = "", i = 0;
  const first = (lines[0] || "").trim();
  const v = first.match(/^(VERDICT:\s*)?(PASS|CHANGES|APPROVE|ESCALATE)$/);
  if (v) {
    const cls = { PASS: "ok", APPROVE: "ok", CHANGES: "no", ESCALATE: "esc" }[v[2]];
    out += `<div class="verdict ${cls}">${esc(first)}</div>`; i = 1;
  }
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; i++; continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if (h) { out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      out += "<table>" + rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map((r, n) =>
        "<tr>" + r.trim().replace(/^\||\|$/g, "").split("|").map(c =>
          n === 0 ? `<th>${inline(c.trim())}</th>` : `<td>${inline(c.trim())}</td>`).join("") + "</tr>").join("") + "</table>";
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l), tag = ordered ? "ol" : "ul", items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) item += " " + lines[i++].trim();
        items.push(`<li>${inline(item)}</li>`);
      }
      out += `<${tag}>${items.join("")}</${tag}>`; continue;
    }
    if (!l.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#|```|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i])) para.push(lines[i++]);
    out += `<p>${inline(para.join(" "))}</p>`;
  }
  return out;
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>

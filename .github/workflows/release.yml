name: Release

# Pushing a tag vX.Y.Z that matches the root crate's version builds Kika for
# every target, publishes a GitHub release, then updates the Homebrew tap.
# Every job runs on GitHub-hosted runners. See docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Two pushes of the same tag queue; a release in flight is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: check tag matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - id: check
        name: Compare tag and crate version
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kika") | .version')
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-latest
          # Hosted Intel macOS runners are being retired: cross-compile on Apple
          # silicon and smoke-test under Rosetta.
          - target: x86_64-apple-darwin
            runs-on: macos-latest
            rosetta: true
          # 22.04 keeps the glibc floor low.
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      ROSETTA: ${{ matrix.rosetta && 'true' || 'false' }}
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No build cache: a release binary is built from a clean target dir.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --locked --target "$TARGET"

      - name: Strip and locate the binary
        run: |
          dir="target/$TARGET/release"
          case "$RUNNER_OS" in
            Windows) bin="$dir/kika.exe" ;;
            macOS) bin="$dir/kika"; strip -x "$bin" ;;
            *) bin="$dir/kika"; strip "$bin" ;;
          esac
          echo "BIN=$bin" >> "$GITHUB_ENV"

      - name: Smoke test kika --version
        run: |
          if [ "$ROSETTA" = true ]; then
            if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::notice::Rosetta is not available; skipped the $TARGET smoke test"
              exit 0
            fi
            out=$(arch -x86_64 "$BIN" --version)
          else
            out=$("$BIN" --version)
          fi
          out=${out%$'\r'}
          if [ "$out" != "kika $VERSION" ]; then
            echo "::error::kika --version printed '$out', expected 'kika $VERSION'"
            exit 1
          fi
          echo "$out"

      - name: Package
        run: |
          name="kika-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "$BIN" LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$name.zip"
            7z a -tzip "$archive" "$name" > /dev/null
          else
            archive="$name.tar.gz"
            # Keeps macOS tar from adding ._ files for extended attributes.
            COPYFILE_DISABLE=1 tar -czf "$archive" "$name"
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
          rm -rf "$name"
          cat "$archive.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kika-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # `needs` waits for every build leg, so one failed target means no release.
  release:
    name: publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kika-*
          merge-multiple: true
          path: dist

      - name: Check every archive and checksum is present
        working-directory: dist
        run: |
          ls -l
          archives=$(find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          sums=$(find . -maxdepth 1 -name '*.sha256' | wc -l)
          if [ "$archives" -ne 5 ] || [ "$sums" -ne 5 ]; then
            echo "::error::expected 5 archives and 5 .sha256 files, found $archives and $sums"
            exit 1
          fi
          sha256sum -c ./*.sha256

      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            dist/*

  # The only job that sees the tap token. It pushes Formula/kika.rb and nothing else.
  tap:
    name: update Homebrew tap
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Require TAP_GITHUB_TOKEN
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::error::TAP_GITHUB_TOKEN is not set; the release is published but the tap was not updated. See docs/releasing.md."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: kika

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kika-*
          merge-multiple: true
          path: dist

      - name: Render and check the formula
        run: |
          sha() { cut -d ' ' -f 1 "dist/kika-$VERSION-$1.tar.gz.sha256"; }
          sh kika/packaging/homebrew/render-formula.sh "$VERSION" \
            "$(sha aarch64-apple-darwin)" \
            "$(sha x86_64-apple-darwin)" \
            "$(sha aarch64-unknown-linux-gnu)" \
            "$(sha x86_64-unknown-linux-gnu)" \
            > kika.rb
          ruby -c kika.rb
          cat kika.rb

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pererikbergman/homebrew-tap
          ref: main
          path: tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Commit and push Formula/kika.rb
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../kika.rb Formula/kika.rb
          git add Formula/kika.rb
          if git diff --cached --quiet; then
            echo "::notice::Formula/kika.rb already matches kika $VERSION; nothing to push"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "kika $VERSION"
          git push origin HEAD:main

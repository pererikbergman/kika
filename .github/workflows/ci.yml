name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR replaces the run in flight; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Draft PRs run Linux only to keep billed macOS/Windows minutes low.
        os: ${{ fromJSON(github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # The default temp dir is an 8.3 short name; git reports the long form,
      # so temp repo paths would not compare equal in tests.
      - name: Use a long-form temp directory
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TMP=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "TEMP=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

  # Architecture checks (noupling). Fails only on Issues missing from the
  # committed baseline; see docs/architecture-checks.md.
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Explicit bash adds pipefail, so a failing command inside a pipe fails the step.
    defaults:
      run:
        shell: bash
    env:
      NOUPLING_VERSION: v0.9.2
      # Digest of noupling-linux-x86_64 for NOUPLING_VERSION. Hard-coded so a
      # replaced release asset fails the check instead of running.
      NOUPLING_SHA256: 08ccc01082dfeba071b5914f5b3bcfc0a8ad6ee1e5c0e38a4198577a7ab3eec8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install noupling
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o noupling \
            "https://github.com/pererikbergman/noupling/releases/download/${NOUPLING_VERSION}/noupling-linux-x86_64"
          echo "${NOUPLING_SHA256}  noupling" | sha256sum -c -
          chmod +x noupling
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: noupling scan
        run: |
          noupling --version
          noupling scan .

      # Runs before the gate so the summary is written even when the gate fails.
      - name: Architecture summary
        run: |
          noupling report . --format pr --baseline
          cat .noupling/pr.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on Issues not in the baseline
        run: noupling audit . --baseline

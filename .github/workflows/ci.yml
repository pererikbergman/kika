name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR replaces the run in flight; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    # macos-self-hosted runs on the owner's Mac runner (labels self-hosted, mac),
    # which is not billed; the other legs use GitHub-hosted runners. The runner is
    # picked only for pushes and PRs from branches in this repository, so even if the
    # matrix offered macos-self-hosted to a fork PR, it would ask for a label no runner
    # has. A deleted fork has no head repo and counts as a fork. See docs/ci.md.
    runs-on: ${{ (matrix.os == 'macos-self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","mac"]') || matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Only the unbilled self-hosted Mac runs by default. Ready PRs and pushes add
        # GitHub-hosted Linux and Windows when the repository variable
        # HOSTED_RUNNERS is "true" (turned off while Actions billing is blocked).
        # Fork PRs never get the self-hosted Mac: they use GitHub-hosted macos-latest
        # instead, so a stranger's code never runs on the owner's machine.
        os: ${{ fromJSON((github.event.pull_request.draft || vars.HOSTED_RUNNERS != 'true') && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["macos-self-hosted"]' || '["macos-latest"]') || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["macos-self-hosted","ubuntu-latest","windows-latest"]' || '["macos-latest","ubuntu-latest","windows-latest"]')) }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # The default temp dir is an 8.3 short name; git reports the long form,
      # so temp repo paths would not compare equal in tests.
      - name: Use a long-form temp directory
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TMP=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "TEMP=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to a SHA, so the toolchain no longer comes from the ref name.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --locked --workspace

  # Architecture checks (noupling). Fails only on Issues missing from the
  # committed baseline; see docs/architecture-checks.md.
  architecture:
    name: architecture
    # The owner's self-hosted Mac runner (Apple silicon), which is not billed, for
    # pushes and PRs from branches in this repository. Fork PRs use GitHub-hosted
    # macos-latest, also Apple silicon, so the pinned noupling binary still fits.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","mac"]') || 'macos-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    # Explicit bash adds pipefail, so a failing command inside a pipe fails the step.
    defaults:
      run:
        shell: bash
    env:
      NOUPLING_VERSION: v0.9.2
      # Digest of noupling-macos-aarch64 for NOUPLING_VERSION. Hard-coded so a
      # replaced release asset fails the check instead of running.
      NOUPLING_SHA256: 0b12ea84edcb77b90f769e20c130ed364a552467ed910c7381a5e05fc2db1f90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install noupling
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o noupling \
            "https://github.com/pererikbergman/noupling/releases/download/${NOUPLING_VERSION}/noupling-macos-aarch64"
          echo "${NOUPLING_SHA256}  noupling" | shasum -a 256 -c -
          chmod +x noupling
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: noupling scan
        run: |
          noupling --version
          noupling scan .

      # Runs before the gate so the summary is written even when the gate fails.
      - name: Architecture summary
        run: |
          noupling report . --format pr --baseline
          cat .noupling/pr.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on Issues not in the baseline
        run: noupling audit . --baseline

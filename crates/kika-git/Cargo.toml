[package]
name = "kika-git"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pererikbergman/kika"
publish = false

[features]
# Exposes the test builders (`fake`, fixtures) to other crates' tests.
# Only `[dev-dependencies]` turn it on, so release builds never carry them.
test-support = []

[dependencies]
# Only `Span::width` in `diff.rs`, so emoji widths stay exactly as drawn.
ratatui = "0.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects, so stopping git stops every process it started.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

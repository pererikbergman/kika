[package]
name = "kika-forge"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Exposes the test builders (`FakeGh`, fixtures) to other crates' tests.
# Only `[dev-dependencies]` turn it on, so release builds never carry them.
test-support = ["kika-git/test-support"]

[dependencies]
kika-git = { path = "../kika-git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# GitLab names a commented line by `sha1(path)_old_new` (its line_code);
# the same RustCrypto family as sha2, sharing its dependencies.
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
kika-git = { path = "../kika-git", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
# Only the open flags that keep a store file from being followed or blocking.
libc = "0.2"
